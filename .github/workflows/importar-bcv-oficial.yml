name: Importar la serie oficial del BCV

# **La serie oficial del BCV desde 2020**, en `historico/bcv-oficial.jsonl`: el
# dólar y el euro de cada fecha valor, de los .xls que publica el BCV por
# trimestre. La lee `importar_bcv_oficial.py`, que explica cómo.
#
# **Sólo a mano**, desde la pestaña Actions o con `gh workflow run`. La serie
# cambia una vez al día y lo de cada día ya lo apunta el registrador cada media
# hora: esto sirve para traer lo de antes del registrador y, de vez en cuando,
# ponerla al día. Va aparte del flujo de cada media hora, que no se toca.
#
# Cuesta cero, como el registrador: repositorio público y máquinas normales de
# GitHub. Son unos dos minutos, y pide al BCV unas treinta cosas con un segundo
# entre una y otra.
on:
  workflow_dispatch: {}

permissions:
  contents: write

# Su propio grupo, no el del registrador: en uno compartido, una pasada de cada
# media hora que llega mientras ésta espera la cancelaría. Las dos tocan
# archivos distintos, así que al publicar nunca chocan.
concurrency:
  group: importar-bcv-oficial
  cancel-in-progress: false

jobs:
  importar:
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # **El lector de .xls, con su versión y su huella.** Si lo que baja pip no
      # es exactamente ese archivo, no se instala.
      - name: Instalar xlrd
        run: python -m pip install --require-hashes -r requisitos-serie-oficial.txt

      - name: Comprobar la lógica antes de usarla
        run: python -m unittest test_importar_bcv_oficial -v

      # Si el BCV cambió la forma de una hoja, o una cifra que ya estaba, este
      # paso falla diciendo por qué y no se publica nada.
      - name: Leer la serie del BCV
        run: python importar_bcv_oficial.py

      # Sólo para leerlo: cuántas fechas coinciden con el registrador y con
      # frankfurter. Que frankfurter no conteste no frena nada.
      - name: Contrastar con el registrador y con frankfurter
        continue-on-error: true
        run: python contrastar_bcv_oficial.py

      - name: Publicar
        run: |
          git config user.name  "registrador-de-tasas"
          git config user.email "registrador@users.noreply.github.com"
          git add historico/bcv-oficial.jsonl
          if git diff --cached --quiet; then
            echo "Nada cambió; no se publica commit vacío."
            exit 0
          fi
          git commit -m "serie oficial del BCV: $(date -u +'%Y-%m-%d %H:%M UTC')"
          # El registrador publica cada media hora en otros archivos: si lo hizo
          # mientras tanto, se pone esto encima de lo suyo y se vuelve a intentar.
          for intento in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase
          done
          exit 1
