name: Registrar tasas

# **Cada media hora**, como lo pidió Antonio el 2026-10-25: «Vamos a consultar la
# tasa BCB cada media hora después de las 4 de la tarde… Y luego la tasa Binance
# la podemos leer cada media hora». Al BCV no se le pregunta en cada pasada: eso
# lo decide el propio script, que lo mira desde las 3:30 de la tarde de Caracas
# hasta que aparece la publicación nueva, y una vez por la mañana.
#
# **Y los minutos no son 0 y 30 a propósito.** En punto y a la media es cuando
# arranca medio GitHub a la vez; si no quedan máquinas libres el trabajo no llega
# ni a empezar. El 2026-08-06 pasó cinco veces seguidas.
#
# Cuesta cero: en un repositorio público, las máquinas normales de GitHub no se
# cobran. Y es poca carga: unas 48 pasadas de medio minuto al día, y nada se queda
# encendido esperando.
on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# Un solo registrador a la vez. Si una pasada se alarga, la siguiente espera en
# vez de pelearse con ella por el mismo archivo.
concurrency:
  group: registrar
  cancel-in-progress: false

jobs:
  registrar:
    runs-on: ubuntu-latest
    # El script se pone un tope de tres minutos y medio para consultar; esto le
    # deja margen para instalar Python, correr las pruebas y publicar.
    timeout-minutes: 8

    # **Una pasada que se pierde no es una avería, y no puede avisar como si lo
    # fuera.** La mayoría de los fallos de aquí no son del programa: GitHub se
    # queda sin máquinas libres, el trabajo ni siquiera arranca, y aun así el
    # dueño del repositorio recibe un correo. Muchos correos por algo que se
    # arregla solo enseñan a no leerlos, y entonces el día que llegue uno de
    # verdad tampoco se lee.
    #
    # La alarma vive donde se miran las cifras: **la app dice de cuándo es cada
    # tasa y avisa en cuanto se queda vieja**, venga el retraso de donde venga. Y
    # lo que sí es un error del programa lo caza el paso de pruebas de aquí
    # abajo, antes de tocar ninguna fuente.
    continue-on-error: true

    steps:
      # **Lo último de main, no lo de cuando se disparó.** Una pasada que espera
      # en la cola sacaría por defecto el commit del momento en que la
      # dispararon; si la anterior publicó mientras tanto, partiría de un
      # `tasas.json` viejo y chocaría al publicar.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Comprobar la lógica antes de usarla
        run: python -m unittest test_registrar -v

      - name: Consultar y anotar
        run: python registrar.py

      - name: Publicar
        run: |
          git config user.name  "registrador-de-tasas"
          git config user.email "registrador@users.noreply.github.com"
          git add tasas.json historico/
          if git diff --cached --quiet; then
            echo "Nada cambió; no se publica commit vacío."
            exit 0
          fi
          git commit -m "tasas: $(date -u +'%Y-%m-%d %H:%M UTC')"
          # Otra ejecución puede haber publicado mientras tanto: se reintenta
          # una vez sobre lo último en vez de fallar.
          git push || (git pull --rebase --autostash && git push)
