name: Registrar tasas

# **Cada cuarto de hora.** Lo manda la tasa de la calle: el precio del USDT en
# Binance se mueve todo el día, y con media hora de hueco un cambio de moneda
# se registra con un número que ya no es. Al BCV NO se le pregunta en cada
# pasada — eso lo decide el propio script, que sabe que publica una vez al día
# entre las 4 y las 10 de la noche y que a las 5 de la mañana toca repescar si
# faltó.
#
# **Y los minutos no son 0, 15, 30, 45 a propósito.** En punto y a los cuartos
# es cuando arranca medio GitHub a la vez; si no quedan máquinas libres el
# trabajo no llega ni a empezar. El 2026-08-06 pasó cinco veces seguidas.
#
# Con este ritmo, una pasada perdida cuesta quince minutos de retraso en vez de
# media hora, y hacen falta muchas seguidas para que se note.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# Un solo registrador a la vez. Si una pasada se alarga, la siguiente espera en
# vez de pelearse con ella por el mismo archivo.
concurrency:
  group: registrar
  cancel-in-progress: false

jobs:
  registrar:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # **Una pasada que se pierde no es una avería, y no puede avisar como si lo
    # fuera.** La mayoría de los fallos de aquí no son del programa: GitHub se
    # queda sin máquinas libres, el trabajo ni siquiera arranca, y aun así el
    # dueño del repositorio recibe un correo. Cinco correos en una tarde por
    # algo que se arregla solo en quince minutos enseñan a no leerlos, y
    # entonces el día que llegue uno de verdad tampoco se lee.
    #
    # La alarma vive donde se miran las cifras: **la app avisa en su pantalla de
    # inicio en cuanto la tasa se queda vieja**, venga el retraso de donde
    # venga. Y lo que sí es un error del programa lo caza el paso de pruebas de
    # aquí abajo, antes de tocar ninguna fuente.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Comprobar la lógica antes de usarla
        run: python -m unittest test_registrar -v

      - name: Consultar y anotar
        run: python registrar.py

      - name: Publicar
        run: |
          git config user.name  "registrador-de-tasas"
          git config user.email "registrador@users.noreply.github.com"
          git add tasas.json historico/
          if git diff --cached --quiet; then
            echo "Nada cambió; no se publica commit vacío."
            exit 0
          fi
          git commit -m "tasas: $(date -u +'%Y-%m-%d %H:%M UTC')"
          # Otra ejecución puede haber publicado mientras tanto: se reintenta
          # una vez sobre lo último en vez de fallar.
          git push || (git pull --rebase --autostash && git push)
